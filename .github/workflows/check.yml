name: Check

# Check runs once per commit, on v1 and the merge-ticket-* branches only (#605): a worker runs
# `pnpm check` before opening a pull request, and the merge-ticket run is the gate. It doesn't run on
# pull_request or on ticket-* pushes, which ran it twice per commit and queued the landing runs behind
# them. A push to main doesn't run it: main is only fast-forwarded to a commit v1's push run already
# checked. A Check run has 8 jobs, so 2 fit at once in GitHub's 20 concurrent jobs. The e2e suite, the
# published client and pack smoke run in the Release workflow, before it publishes.
on:
  push:
    branches: [v1, "merge-ticket-*"]
  workflow_dispatch:

permissions:
  contents: read

# Each v1 push run gets a group of its own, so a newer push neither cancels it nor replaces it in
# the queue. Other refs share one group per ref, where a newer push cancels the older run.
concurrency:
  group: check-${{ github.ref }}-${{ github.ref == 'refs/heads/v1' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v1' }}

jobs:
  # The 8 static checks, one step each, one after another on one runner: the job stops at the first
  # that fails, and its failed step names it. Each step runs the check's own `pnpm check --job=`.
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # lint needs the base ref's baseline; drift's hygiene needs origin/v1, each ADR's first commit
          # and the deploy/* tags, to compare the migrations list with production's.
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
        with:
          cache-name: static
      # lint's baseline ratchet and drift's lint-config guard both judge the push's range.
      - name: Pick the lint baseline's base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE=HEAD^; fi
          echo "BASE=$BEFORE" >> "$GITHUB_ENV"
      - name: pnpm check --job=lint
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=lint --base="$BASE" --ci
      - name: pnpm check --job=canaries
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=canaries --ci
      - name: pnpm check --job=types
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=types --ci
      - name: pnpm check --job=fixers
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=fixers --ci
      - name: pnpm check --job=seams
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=seams --ci
      - name: pnpm check --job=knip
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=knip --ci
      - name: pnpm check --job=format
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=format --ci
      - name: pnpm check --job=drift
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=drift --base="$BASE" --ci

  # Every browser test in one job took 205s of a passing run and was cancelled at the 5-minute
  # limit on loaded runners (#455), so Playwright's --shard splits them, test by test, across 3
  # jobs: about 70s of tests each at 115 tests. Each shard uploads its JSON report, whose
  # stats.expected sum is the run's browser test count.
  browser:
    name: browser ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: browser
      # No --with-deps: ubuntu-latest already has every library the headless shell needs, and
      # --with-deps ran apt-get update and fetched 22 MB of fonts from the Ubuntu mirror, which
      # sometimes crawled at ~100 kB/s and took 4.5 minutes (#265).
      - name: Install headless Chromium
        run: pnpm exec playwright install --only-shell chromium
      - name: pnpm check --job=browser --shard=${{ matrix.shard }}/3
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=browser --shard=${{ matrix.shard }}/3 --ci
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-browser-${{ matrix.shard }}
          path: |
            .timings/*.txt
            .timings/browser.json
          include-hidden-files: true
          if-no-files-found: ignore
      # A local pnpm check fetches the newest of these on its base to pick the browser tests a branch reaches (#444).
      - name: Upload the browser coverage map
        uses: actions/upload-artifact@v4
        with:
          name: browser-coverage-map-${{ matrix.shard }}
          path: .browser-coverage/map.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30

  # Two shards ran 4-5 minutes each and one was cancelled at the 5-minute limit after 284.7s of
  # passing tests (#485), so Vitest's --shard splits the test files across 3 jobs. Each uploads its
  # blob report, and the coverage job merges every vitest-blob-* into one run.
  tests:
    name: tests ${{ matrix.shard }}/3
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - run: node scripts/check.ts --job=tests --shard=${{ matrix.shard }}/3 --ci
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-${{ matrix.shard }}
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: node scripts/check.ts --job=tests --merge --ci
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-merged
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore
