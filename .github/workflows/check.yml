name: Check

# Check runs once per commit, on v1 and the merge-ticket-* branches (#605), and on a pull request
# into v1 (#737): a worker runs `pnpm check` before opening a pull request. It doesn't run on
# ticket-* pushes, which ran it twice per commit and queued the landing runs behind them. A push to main doesn't run
# it: main is only fast-forwarded to a commit v1's push run already checked. A Check run has 8 jobs,
# the static checks and the unit tests on the merged result: `static`, `tests` ×6 and `coverage`.
# The browser tests, pack smoke, the published client and the e2e suite run in the Release
# workflow, the gate, on the newest v1 commit whose Check run is green, before it publishes and
# deploys (#636, docs/adr/0114-release-is-the-gate-on-the-newest-green-v1-commit.md).
#
# A pull request into v1 runs the same jobs on its merge with v1, plus `browser` ×6: Release's
# browser job, each shard running only its share of the browser tests the change reaches (#737).
# A merged pull request ran no Check before it, so a broken browser test, a coverage gap or an
# unformatted file showed only when Release ran. A merge-ticket-* pull request runs none of it,
# since its branch's push run already checked the same merge. Every reader of Check runs asks for
# push runs, so a pull_request run never stands in for one.
on:
  push:
    branches: [v1, "merge-ticket-*"]
  pull_request:
    branches: [v1]
  workflow_dispatch:

permissions:
  contents: read

# Each v1 push run gets a group of its own, so a newer push neither cancels it nor replaces it in
# the queue. Other refs share one group per ref, where a newer push cancels the older run.
concurrency:
  group: check-${{ github.ref }}-${{ github.ref == 'refs/heads/v1' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/v1' }}

jobs:
  # The 8 static checks, one step each, one after another on one runner: the job stops at the first
  # that fails, and its failed step names it. Each step runs the check's own `pnpm check --job=`.
  static:
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'merge-ticket-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # lint needs the base ref's baseline; drift's hygiene needs origin/v1, each ADR's first commit
          # and the deploy/* tags, to compare the migrations list with production's.
          fetch-depth: 0
          fetch-tags: true
      - uses: ./.github/actions/setup
        with:
          cache-name: static
      # lint's baseline ratchet and drift's lint-config guard both judge the push's range.
      - name: Pick the lint baseline's base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then BEFORE=HEAD^; fi
          echo "BASE=$BEFORE" >> "$GITHUB_ENV"
      - name: pnpm check --job=lint
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=lint --base="$BASE" --all --ci
      - name: pnpm check --job=canaries
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=canaries --all --ci
      - name: pnpm check --job=types
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=types --all --ci
      - name: pnpm check --job=fixers
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=fixers --all --ci
      - name: pnpm check --job=seams
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=seams --all --ci
      - name: pnpm check --job=knip
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=knip --all --ci
      - name: pnpm check --job=format
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=format --all --ci
      - name: pnpm check --job=drift
        env:
          NODE_COMPILE_CACHE: node_modules/.cache/node-compile
        run: node scripts/check.ts --job=drift --base="$BASE" --all --ci

  # Split by file count, 3 shards took 288, 177 and 157s of tests on a 4-core runner, and the first
  # was cut off at the 5-minute limit (#707). So 6 jobs each run the test files that give it a sixth
  # of the test time the newest earlier Check run recorded in its test-timings-tests-* artifacts,
  # falling back to Vitest's --shard by file count when there are none (scripts/lib/timed-shards.ts).
  # A shard whose gh call fails reading them fails instead: the others split by the timings, so a
  # split of its own would leave files to no shard and coverage short (#737).
  # Each uploads its blob report, and the coverage job merges every vitest-blob-* into one run.
  tests:
    name: tests ${{ matrix.shard }}/6
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'merge-ticket-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To read the timings an earlier run uploaded.
      actions: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check.ts --job=tests --shard=${{ matrix.shard }}/6 --run=${{ github.run_id }} --all --ci
      - uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest/blob
          include-hidden-files: true
          retention-days: 1
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-${{ matrix.shard }}
          path: |
            .timings/*.txt
            .timings/tests.json
          include-hidden-files: true
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: tests
      - uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          path: .vitest/blob
          merge-multiple: true
      - run: node scripts/check.ts --job=tests --merge --all --ci
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-tests-merged
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  # Only on a pull request: the browser tests its change reaches, in Release's 6 shards.
  browser:
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'merge-ticket-')
    permissions:
      contents: read
      # To read the timings and the coverage map Release uploaded.
      actions: read
    uses: ./.github/workflows/browser.yml
    with:
      reached: true
