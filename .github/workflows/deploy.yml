# Deploy the cookout to Fly (app `cookout`, lhr) and the example handler (app
# `cookout-handler-example`, lhr) when the Release workflow calls it after its gate passed on a
# commit (`gated: true`, `ref: <sha>`; its own e2e-docker is skipped, since the gate ran it), or on a
# workflow_dispatch on main after `pnpm e2e:docker` passes. Then it checks the deployed stream, that
# a command call gets the handler's reply, and that the full e2e suite passes against the deployed
# URL and leaves none of its e2e- identities there, then tags the deployed commit deploy/<short-sha>.
# A push to main starts nothing: Release moves main with its own token, which starts no workflow.
# A workflow_dispatch on any other branch runs the same e2e and the deployed checks without
# deploying the cookout; `restart: true` also restarts its machine first, and `handler: true`
# deploys the example handler from that branch. If the cookout's deploy or the deployed checks fail,
# `rollback` redeploys the image it ran before. Recipes: docs/verification.md ("Deploy it to Fly").
name: Deploy

on:
  workflow_call:
    inputs:
      gated:
        description: Release's gate passed on ref, so deploy it and skip e2e-docker
        type: boolean
        default: false
      ref:
        description: The commit to deploy
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      restart:
        description: Restart the Fly machine, then check the board outlived it
        type: boolean
        default: false
      handler:
        description: Provision and deploy the example handler from this branch (never the cookout)
        type: boolean
        default: false

permissions:
  contents: read

# One deploy at a time, and never cancel one halfway.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # Release's gate already ran it on the commit it calls Deploy with.
  e2e-docker:
    if: ${{ !inputs.gated }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # A local action resolves from the checked-out tree: take .github/actions from the workflow's own
      # commit, which may differ from the commit under test (#748, docs/adr/0122).
      - name: Local actions from the workflow's commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git cat-file -e "$WORKFLOW_SHA^{commit}" 2>/dev/null || git fetch --quiet --depth=1 origin "$WORKFLOW_SHA"
          rm -rf .github/actions
          git checkout "$WORKFLOW_SHA" -- .github/actions
      - uses: ./.github/actions/setup
        with:
          cache-name: e2e-docker
      - uses: ./.github/actions/install-chromium
      - run: pnpm e2e:docker

  deploy:
    if: ${{ !cancelled() && (needs.e2e-docker.result == 'success' || inputs.gated) && (github.ref == 'refs/heads/main' || inputs.gated) }}
    needs: e2e-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    outputs:
      previous-image: ${{ steps.previous.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # Only for scripts/rollback-image.ts, which needs no installed dependencies.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # The image `rollback` redeploys if this deploy or `deployed` fails. Empty on the app's first deploy.
      - name: Record the image the machine runs now
        id: previous
        run: |
          image="$(flyctl machines list -a cookout --json | node scripts/rollback-image.ts)" || true
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "rollback-image: ${image:-none}"
      - run: flyctl deploy -a cookout --remote-only --ha=false

  # The example handler, after the cookout it posts to. A rerun of provision changes nothing.
  deploy-handler:
    needs: [e2e-docker, deploy]
    if: >-
      ${{ !cancelled() && (needs.e2e-docker.result == 'success' || inputs.gated) && needs.deploy.result != 'failure'
      && ((github.ref == 'refs/heads/main' || inputs.gated) || inputs.handler) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COOKOUT_URL: https://cookout.fly.dev
      COOKOUT_TOKEN: ${{ secrets.COOKOUT_E2E_ADMIN_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_HANDLER_API_TOKEN }}
    steps:
      - name: The secrets are set
        run: |
          for name in COOKOUT_TOKEN FLY_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty: set its GitHub secret (docs/verification.md, \"Deploy the example handler to Fly\")"; exit 1; fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # A local action resolves from the checked-out tree: take .github/actions from the workflow's own
      # commit, which may differ from the commit under test (#748, docs/adr/0122).
      - name: Local actions from the workflow's commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git cat-file -e "$WORKFLOW_SHA^{commit}" 2>/dev/null || git fetch --quiet --depth=1 origin "$WORKFLOW_SHA"
          rm -rf .github/actions
          git checkout "$WORKFLOW_SHA" -- .github/actions
      - uses: ./.github/actions/setup
        with:
          cache-name: deploy-handler
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: scripts/handler-provision.sh
      - run: >-
          flyctl deploy . -c packages/handler-example/fly.toml --dockerfile packages/handler-example/Dockerfile
          --remote-only --ha=false

  deployed:
    needs: [e2e-docker, deploy, deploy-handler]
    if: ${{ !cancelled() && (needs.e2e-docker.result == 'success' || inputs.gated) && needs.deploy.result != 'failure' && needs.deploy-handler.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COOKOUT_URL: https://cookout.fly.dev
      COOKOUT_TOKEN: ${{ secrets.COOKOUT_E2E_ADMIN_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: The secrets are set
        run: |
          for name in COOKOUT_TOKEN FLY_API_TOKEN; do
            if [ -z "${!name}" ]; then echo "::error::$name is empty: set its GitHub secret (docs/verification.md, \"Deploy it to Fly\")"; exit 1; fi
          done
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      # A local action resolves from the checked-out tree: take .github/actions from the workflow's own
      # commit, which may differ from the commit under test (#748, docs/adr/0122).
      - name: Local actions from the workflow's commit
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git cat-file -e "$WORKFLOW_SHA^{commit}" 2>/dev/null || git fetch --quiet --depth=1 origin "$WORKFLOW_SHA"
          rm -rf .github/actions
          git checkout "$WORKFLOW_SHA" -- .github/actions
      - uses: ./.github/actions/setup
        with:
          cache-name: deployed
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Restart the machine
        if: ${{ inputs.restart }}
        run: |
          flyctl machine restart -a cookout "$(flyctl machines list -a cookout --json | jq -r '.[0].id')"
          for _ in $(seq 30); do curl -fsS "$COOKOUT_URL/v1/health" && break; sleep 2; done
      # Earlier runs deactivated their identities instead of deleting them (#172). A rerun deletes nothing new.
      - name: Delete the e2e- identities that have no messages
        run: scripts/e2e-identity-sweep.sh
      - name: identity list
        run: node app/main.ts identity list --deactivated | jq -c '[.identities[].name]' | tee "$RUNNER_TEMP/identities-before.json"
      - name: The stream stays open for 65 s and hears heartbeats
        run: scripts/stream-check.sh 65
      - name: A call to the example handler gets its reply within 30 s
        run: scripts/handler-check.sh
      - uses: ./.github/actions/install-chromium
      - name: The full e2e suite passes against the deployed cookout
        run: pnpm --filter ./packages/e2e test
        env:
          COOKOUT_E2E_URL: ${{ env.COOKOUT_URL }}
          COOKOUT_E2E_ADMIN_TOKEN: ${{ env.COOKOUT_TOKEN }}
      # Each run deletes its own channels and then its identities when it ends, passing or failing, so this runs
      # either way. Deactivated ones are listed too, so an identity deactivated instead of deleted counts as left.
      # Every identity the suite makes is named e2e-<run>-… (runPrefix in packages/e2e/app/modules/cookout),
      # so only new e2e- names count: real people and agents join the deployed cookout mid-run too.
      - name: The e2e run left none of its identities
        if: ${{ !cancelled() }}
        run: |
          node app/main.ts identity list --deactivated | jq -c '[.identities[].name]' > "$RUNNER_TEMP/identities-after.json"
          jq -e -n --slurpfile before "$RUNNER_TEMP/identities-before.json" --slurpfile after "$RUNNER_TEMP/identities-after.json" \
            '[($after[0] - $before[0])[] | select(startswith("e2e-"))] as $left
            | if $left == [] then true else ("e2e left these identities on the deployed cookout: \($left)\n" | halt_error) end'
      # Each test deletes its own channels when it ends, and the suite deletes every e2e- channel after it runs.
      - name: The e2e run left no e2e- channel
        if: ${{ !cancelled() }}
        run: |
          node app/main.ts channel list | jq -e '[.channels[].name | select(startswith("e2e-"))] as $left
            | if $left == [] then true else ("e2e left these channels on the deployed cookout: \($left)\n" | halt_error) end'

  # A release that fails to deploy, or fails the deployed checks, can leave the board down on it (#249), so
  # redeploy the image the machine ran before, then fail the run naming both images.
  rollback:
    needs: [deploy, deployed]
    if: >-
      ${{ !cancelled() && (github.ref == 'refs/heads/main' || inputs.gated)
      && (needs.deploy.result == 'failure' || needs.deployed.result == 'failure') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      PREVIOUS_IMAGE: ${{ needs.deploy.outputs.previous-image }}
      FAILED_JOB: ${{ needs.deploy.result == 'failure' && 'deploy' || 'deployed' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Redeploy the image the machine ran before
        run: |
          failed="$(flyctl machines list -a cookout --json | node scripts/rollback-image.ts)" || failed=unknown
          if [ -z "$PREVIOUS_IMAGE" ]; then
            echo "### Not rolled back: $FAILED_JOB failed on $failed, and no earlier image was recorded" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$FAILED_JOB failed on $failed, and there is no earlier image to roll back to"
            exit 1
          fi
          if flyctl deploy -a cookout --image "$PREVIOUS_IMAGE" --ha=false; then outcome="rolled back"; else outcome="FAILED to roll back"; fi
          echo "### $FAILED_JOB failed on $failed, and the run $outcome to $PREVIOUS_IMAGE" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::$FAILED_JOB failed on $failed, and the run $outcome to $PREVIOUS_IMAGE"
          exit 1

  # Record the commit production now runs: the migrations check in `pnpm check` (hygiene) compares the
  # migrations list with the newest deploy/* tag's (#249). Tags are only ever added, never moved or force-pushed.
  tag-deployed:
    needs: [deploy, deployed]
    if: ${{ !cancelled() && (github.ref == 'refs/heads/main' || inputs.gated) && needs.deploy.result == 'success' && needs.deployed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Tag the deployed commit deploy/<short-sha>
        env:
          SHA: ${{ inputs.ref || github.sha }}
        run: |
          tag="deploy/${SHA::8}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists; tags are never moved."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Deployed to Fly by run $GITHUB_RUN_ID" "$SHA"
          git push origin "refs/tags/$tag"
