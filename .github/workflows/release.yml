name: Release

# Opens or updates the "Version Packages" pull request from the changesets on main. Merging that
# pull request publishes @ai-hero/cookout to npm by trusted publishing (OIDC), with provenance and
# no npm token (docs/adr/0050-the-cli-is-published-to-npm.md). The e2e suite, pack smoke and the
# published client run first, and release needs all three, so a release can't ship a broken package
# or image. They moved here from Check (#605).
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The image and the example handler in Docker, driven by packages/e2e, as Deploy runs it before
  # deploying main.
  e2e-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: e2e-docker
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm e2e:docker
      - name: Upload the per-file test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-e2e-docker
          path: .timings/*.txt
          include-hidden-files: true
          if-no-files-found: ignore

  pack:
    name: pack smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: pack
      - run: pnpm run --silent pack:smoke

  # The newest @ai-hero/cookout on npm drives a dev cookout from this commit, so removing a response
  # field that the published client still requires fails here (docs/verification.md).
  published-client:
    name: published client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          cache-name: published-client
      - run: pnpm run --silent published-client

  release:
    needs: [e2e-docker, pack, published-client]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          cache-name: release
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1
      - name: Open or update the Version Packages pull request
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version
          title: Version Packages
          commit: Version Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Runs once no changesets are left, that is on the push that merges the Version Packages pull
      # request. `changeset publish` publishes only a version npm doesn't have yet. This step is the
      # only publisher: passing `publish:` to the action as well would publish twice in one run.
      - name: Publish to npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm release
