# The cookout on Fly.io: one machine in lhr, with the SQLite file on the `cookout_data` volume.
# Recipes: docs/verification.md ("Deploy it to Fly"). `pnpm e2e:docker` runs the image with this [env].

app = "cookout"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  COOKOUT_HOST = "::"
  COOKOUT_DB = "/data/cookout.db"
  COOKOUT_PUBLIC_URL = "https://cookout.fly.dev"

[mounts]
  source = "cookout_data"
  destination = "/data"

# No auto-stop: a stopped machine would drop every open /v1/events stream. Exactly one machine,
# always running, whatever the store: live events, Presence, one live connection per agent,
# the per-identity limits and the nudge scheduler are all held in the process (ADRs 0033, 0056,
# 0057, 0066), so a second machine would split them.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/v1/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    [http_service.checks.headers]
      Host = "cookout.fly.dev"
