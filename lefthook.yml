# A blocked commit prints only what is left to fix by hand: each job's output, and only when it fails.
output:
  - execution_out
pre-commit:
  jobs:
    - name: refuse partially staged files
      run: scripts/refuse-partially-staged.sh
    - name: lint
      glob: "*.{js,ts,cjs,mjs,jsx,tsx}"
      run: node scripts/lint-ratchet.ts --fix {staged_files}
      stage_fixed: true
    - name: format
      glob: "*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css}"
      run: scripts/quiet.sh node_modules/.bin/biome format --write --reporter=concise --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true
    - group:
        parallel: true
        jobs:
          - name: adrs are append-only
            glob: "docs/adr/*.md"
            run: node scripts/hygiene.ts --staged
          - name: types
            run: node_modules/.bin/tsc --noEmit --incremental
          - name: seams
            run: scripts/quiet.sh node_modules/.bin/depcruise app packages/handler-example scripts --cache node_modules/.cache/depcruise && scripts/quiet.sh node_modules/.bin/depcruise packages/e2e/app --config packages/e2e/.dependency-cruiser.mjs --cache node_modules/.cache/depcruise-e2e
